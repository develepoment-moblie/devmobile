name: nova_paris
description: "Nova Paris — utilisateurs, chambres et ménage."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  pointycastle: ^4.0.0
  sqflite: ^2.4.4+2
  path: ^1.9.1
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/nova_paris_logo.png
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
